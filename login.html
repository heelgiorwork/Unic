<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УНИЦ | Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-top">
                <div class="logo">
                    <h1>Удмуртский нефтяной инновационный центр</h1>
                </div>
                <a href="index.html" class="login-btn" style="background: white; color: #0033a0; border: 1px solid #0033a0;">
                    ← На главную
                </a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-card">
            <!-- Вкладки -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Вход</button>
                <button class="tab" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" class="auth-form active">
                <h2>Вход в систему</h2>
                <input type="text" placeholder="Имя пользователя" required>
                <input type="password" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary">Войти</button>
                <p class="auth-link">
                    Нет аккаунта? <a href="#" onclick="switchTab('register')">Зарегистрируйтесь</a>
                </p>
            </form>

            <!-- Форма регистрации -->
            <form id="registerForm" class="auth-form">
                <h2>Регистрация</h2>
                <input type="text" placeholder="Имя пользователя" required>
                <input type="password" placeholder="Пароль" required>
                <select>
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                </select>
                <button type="submit" class="btn btn-success">Создать аккаунт</button>
                <p class="auth-link">
                    Есть аккаунт? <a href="#" onclick="switchTab('login')">Войдите</a>
                </p>
            </form>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
